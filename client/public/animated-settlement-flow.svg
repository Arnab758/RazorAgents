<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <radialGradient id="settleBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="70%" stop-color="#050814"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>

    <linearGradient id="goldBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes marchConduit {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes soundwave {
      0% { r: 12px; opacity: 1; stroke-width: 3; }
      100% { r: 55px; opacity: 0; stroke-width: 0.5; }
    }
    @keyframes packetHop {
      0% { cx: 120px; }
      50% { cx: 400px; }
      100% { cx: 680px; }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes stampFlash {
      0%, 80% { opacity: 0.7; }
      90% { opacity: 1; filter: drop-shadow(0 0 8px #10b981); }
      100% { opacity: 0.7; }
    }

    .conduit-flow {
      stroke-dasharray: 12 8;
      animation: marchConduit 2s linear infinite;
    }
    .wave-pulse-1 {
      animation: soundwave 2.2s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
    }
    .wave-pulse-2 {
      animation: soundwave 2.2s cubic-bezier(0.1, 0.8, 0.3, 1) infinite 0.7s;
    }
    .wave-pulse-3 {
      animation: soundwave 2.2s cubic-bezier(0.1, 0.8, 0.3, 1) infinite 1.4s;
    }
    .packet-runner {
      animation: packetHop 3s ease-in-out infinite;
    }
    .stamp-badge {
      animation: stampFlash 3s infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="800" height="320" fill="url(#settleBg)"/>

  <!-- Top Title Banner -->
  <g transform="translate(30, 26)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#60a5fa" letter-spacing="1">
      RAZORPAY INSTANT RAILS // NPCI UAP BOUNDED MANDATE &amp; GST TAX SETTLEMENT
    </text>
  </g>

  <!-- Flowing Main Pipeline Track -->
  <line x1="120" y1="160" x2="680" y2="160" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
  <line x1="120" y1="160" x2="680" y2="160" stroke="url(#goldBeam)" stroke-width="4" stroke-linecap="round" class="conduit-flow" filter="url(#goldGlow)"/>

  <!-- Moving Data Packets on Track -->
  <circle cy="160" r="6" fill="#38bdf8" class="packet-runner" filter="url(#goldGlow)"/>

  <!-- STEP 1: CONSENSUS RATIFIED -->
  <g transform="translate(120, 160)">
    <circle cx="0" cy="0" r="42" fill="#0f172a" stroke="#0284c7" stroke-width="2" filter="url(#goldGlow)"/>
    <circle cx="0" cy="0" r="28" fill="#0369a1" fill-opacity="0.3"/>
    <path d="M-8 0 L-2 6 L10 -6" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">
      1. RATIFIED DEAL
    </text>
    <text x="0" y="78" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">
      ₹6,390 agreed
    </text>
  </g>

  <!-- STEP 2: RAZORPAY INSTANT ESCROW & GATEWAY -->
  <g transform="translate(400, 160)">
    <circle cx="0" cy="0" r="50" fill="#0f172a" stroke="#3b82f6" stroke-width="2.5" filter="url(#goldGlow)"/>
    <rect x="-24" y="-24" width="48" height="48" rx="12" fill="#1d4ed8"/>
    <!-- Razorpay Lightning Bolt -->
    <path d="M-4 -14 L-12 4 L-2 4 L-6 14 L8 -4 L-2 -4 Z" fill="#ffffff"/>

    <!-- Step Label -->
    <text x="0" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">
      2. RAZORPAY MODAL
    </text>
    <text x="0" y="88" text-anchor="middle" font-family="monospace" font-size="9" fill="#93c5fd">
      Single-Turn Escrow
    </text>
  </g>

  <!-- STEP 3: SOUNDBOX & GST INVOICE -->
  <g transform="translate(680, 160)">
    <circle cx="0" cy="0" r="42" fill="#064e3b" stroke="#10b981" stroke-width="2" filter="url(#goldGlow)"/>
    
    <!-- Soundbox Waves -->
    <circle cx="0" cy="0" r="16" fill="none" stroke="#34d399" class="wave-pulse-1"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#34d399" class="wave-pulse-2"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#10b981" class="wave-pulse-3"/>

    <!-- Speaker Center Icon -->
    <path d="M-8 -6 L-3 -6 L4 -12 L4 12 L-3 6 L-8 6 Z" fill="#ffffff"/>

    <!-- Step Label -->
    <text x="0" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">
      3. SOUNDBOX CHIME
    </text>
    <text x="0" y="78" text-anchor="middle" font-family="monospace" font-size="9" fill="#6ee7b7">
      GST Tax Invoice (18%)
    </text>
  </g>

  <!-- Bottom Stamp Badge -->
  <g class="stamp-badge" transform="translate(30, 274)">
    <rect x="0" y="0" width="740" height="30" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="20" font-family="monospace" font-size="10" fill="#10b981">
      ✓ RFC-2104 HMAC-SHA256 SIGNATURE CONFIRMED // SAC: 998313 // CGST: 9% SGST: 9% // AUDIO SYNTH READY
    </text>
  </g>
</svg>
