<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="1"/>
      <stop offset="60%" stop-color="#070b14" stop-opacity="1"/>
      <stop offset="100%" stop-color="#03060c" stop-opacity="1"/>
    </radialGradient>
    
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vulcanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sentinelGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="rzpGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients for Data Conduits -->
    <linearGradient id="streamCyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="streamPurpleGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="streamGreenBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowIntense" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseData {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseReverse {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 600; }
    }
    @keyframes spinClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinCounter {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes floatAgent {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatAgentOpposite {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes breatheGlow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.85; }
    }
    @keyframes scanline {
      0% { transform: translateY(-100px); }
      100% { transform: translateY(500px); }
    }
    @keyframes blinkLed {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    .conduit-main {
      stroke-dasharray: 18 12;
      animation: pulseData 3s linear infinite;
    }
    .conduit-fast {
      stroke-dasharray: 8 6;
      animation: pulseData 1.5s linear infinite;
    }
    .conduit-reverse {
      stroke-dasharray: 14 10;
      animation: pulseReverse 2.4s linear infinite;
    }
    .rotor-cw {
      transform-origin: center;
      animation: spinClockwise 12s linear infinite;
    }
    .rotor-ccw {
      transform-origin: center;
      animation: spinCounter 16s linear infinite;
    }
    .float-aura {
      animation: floatAgent 4s ease-in-out infinite;
    }
    .float-vulcan {
      animation: floatAgentOpposite 4.5s ease-in-out infinite;
    }
    .pulse-glow {
      animation: breatheGlow 3s ease-in-out infinite;
    }
    .led-fast {
      animation: blinkLed 0.8s ease-in-out infinite;
    }
    .led-slow {
      animation: blinkLed 1.8s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="460" fill="url(#bgGlow)"/>

  <!-- Cyber Grid -->
  <g opacity="0.12" stroke="#3b82f6" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="220" x2="1200" y2="220"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="380" x2="1200" y2="380"/>
    
    <line x1="120" y1="0" x2="120" y2="460"/>
    <line x1="280" y1="0" x2="280" y2="460"/>
    <line x1="440" y1="0" x2="440" y2="460"/>
    <line x1="600" y1="0" x2="600" y2="460"/>
    <line x1="760" y1="0" x2="760" y2="460"/>
    <line x1="920" y1="0" x2="920" y2="460"/>
    <line x1="1080" y1="0" x2="1080" y2="460"/>
  </g>

  <!-- Title Header Bar -->
  <g transform="translate(40, 36)">
    <rect x="0" y="0" width="1120" height="34" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-width="1"/>
    <circle cx="20" cy="17" r="5" fill="#ef4444"/>
    <circle cx="36" cy="17" r="5" fill="#eab308"/>
    <circle cx="52" cy="17" r="5" fill="#10b981"/>
    <text x="75" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">
      ACP 1.4 // LIVE MULTI-AGENT COMMERCE NETWORK &amp; RAZORPAY SETTLEMENT HIGHWAY
    </text>
    <rect x="940" y="8" width="160" height="18" rx="4" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="0.8"/>
    <circle cx="952" cy="17" r="3" fill="#38bdf8" class="led-fast"/>
    <text x="964" y="21" font-family="monospace" font-size="10" fill="#38bdf8" font-weight="bold">ACTIVE 5-TURN SSE</text>
  </g>

  <!-- Ambient Glow Spots -->
  <circle cx="220" cy="220" r="160" fill="url(#auraGlow)"/>
  <circle cx="980" cy="220" r="160" fill="url(#vulcanGlow)"/>
  <circle cx="600" cy="170" r="130" fill="url(#sentinelGlow)"/>
  <circle cx="600" cy="360" r="140" fill="url(#rzpGlow)"/>

  <!-- ========================================================================= -->
  <!-- HIGHWAY CONDUITS / DATA CURVES -->
  <!-- ========================================================================= -->

  <!-- Top Deliberation Conduit (Aura AI <-> Central Hub <-> Vulcan AI) -->
  <path d="M 220 220 C 380 90, 820 90, 980 220" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
  <path d="M 220 220 C 380 90, 820 90, 980 220" fill="none" stroke="url(#streamCyanPurple)" stroke-width="4" stroke-linecap="round" class="conduit-main" filter="url(#glow)"/>
  
  <!-- Reverse Response Conduit -->
  <path d="M 980 220 C 820 150, 380 150, 220 220" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  <path d="M 980 220 C 820 150, 380 150, 220 220" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" class="conduit-reverse" opacity="0.85" filter="url(#glow)"/>

  <!-- Vertical Conduits Down to Vulcan Sentinel & Razorpay -->
  <path d="M 600 135 L 600 290" fill="none" stroke="#1e293b" stroke-width="8"/>
  <path d="M 600 135 L 600 290" fill="none" stroke="url(#streamPurpleGreen)" stroke-width="3" class="conduit-fast" filter="url(#glow)"/>

  <!-- Left Buyer Direct Settlement Line -->
  <path d="M 220 220 C 320 340, 460 360, 520 360" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="6 6" class="conduit-main" opacity="0.6"/>

  <!-- Right Merchant Settlement Line -->
  <path d="M 980 220 C 880 340, 740 360, 680 360" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="6 6" class="conduit-reverse" opacity="0.6"/>

  <!-- ========================================================================= -->
  <!-- NODE 1: BUYER AGENT (AURA AI) -->
  <!-- ========================================================================= -->
  <g class="float-aura">
    <!-- Rotating Ring -->
    <g transform="translate(220, 220)">
      <circle cx="0" cy="0" r="54" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="14 10" class="rotor-cw" opacity="0.7"/>
      <circle cx="0" cy="0" r="62" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 18" class="rotor-ccw" opacity="0.5"/>
      <circle cx="0" cy="0" r="44" fill="#082f49" stroke="#00f2fe" stroke-width="2.5" filter="url(#glow)"/>
      <!-- Agent Core Icon -->
      <path d="M-12 -6 L0 -18 L12 -6 L12 12 L-12 12 Z" fill="#00f2fe" opacity="0.9"/>
      <circle cx="0" cy="-2" r="4" fill="#0f172a"/>
    </g>

    <!-- Card Label -->
    <g transform="translate(130, 296)">
      <rect x="0" y="0" width="180" height="74" rx="10" fill="#0f172a" fill-opacity="0.88" stroke="#0284c7" stroke-width="1.5"/>
      <rect x="8" y="8" width="8" height="8" rx="2" fill="#00f2fe" class="led-fast"/>
      <text x="22" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" letter-spacing="0.5">BUYER AGENT</text>
      <text x="10" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Aura AI</text>
      <text x="10" y="52" font-family="monospace" font-size="10" fill="#94a3b8">Gemini 3.1 Flash Lite</text>
      <rect x="10" y="58" width="160" height="8" rx="4" fill="#0369a1" fill-opacity="0.3"/>
      <rect x="10" y="58" width="115" height="8" rx="4" fill="#00f2fe" opacity="0.8"/>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- NODE 2: MERCHANT AGENT (VULCAN COMMERCE AI) -->
  <!-- ========================================================================= -->
  <g class="float-vulcan">
    <!-- Rotating Ring -->
    <g transform="translate(980, 220)">
      <circle cx="0" cy="0" r="54" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="14 10" class="rotor-ccw" opacity="0.7"/>
      <circle cx="0" cy="0" r="62" fill="none" stroke="#c084fc" stroke-width="1" stroke-dasharray="6 18" class="rotor-cw" opacity="0.5"/>
      <circle cx="0" cy="0" r="44" fill="#3b0764" stroke="#a855f7" stroke-width="2.5" filter="url(#glow)"/>
      <!-- Merchant Store Icon -->
      <path d="M-14 -4 L0 -16 L14 -4 L10 14 L-10 14 Z" fill="#c084fc" opacity="0.9"/>
      <rect x="-5" y="2" width="10" height="12" fill="#3b0764"/>
    </g>

    <!-- Card Label -->
    <g transform="translate(890, 296)">
      <rect x="0" y="0" width="180" height="74" rx="10" fill="#0f172a" fill-opacity="0.88" stroke="#7e22ce" stroke-width="1.5"/>
      <rect x="8" y="8" width="8" height="8" rx="2" fill="#c084fc" class="led-slow"/>
      <text x="22" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#c084fc" letter-spacing="0.5">MERCHANT AGENT</text>
      <text x="10" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Vulcan AI</text>
      <text x="10" y="52" font-family="monospace" font-size="10" fill="#94a3b8">CloudGPU Store Floor</text>
      <rect x="10" y="58" width="160" height="8" rx="4" fill="#581c87" fill-opacity="0.3"/>
      <rect x="10" y="58" width="136" height="8" rx="4" fill="#a855f7" opacity="0.8"/>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- NODE 3: CENTRAL DISCOVERY (ACP MANIFEST & MCP ROUTER) -->
  <!-- ========================================================================= -->
  <g transform="translate(600, 110)">
    <!-- Hexagonal or Diamond Core -->
    <circle cx="0" cy="0" r="38" fill="#09203f" stroke="#0284c7" stroke-width="2" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="46" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" class="rotor-cw"/>
    <text x="0" y="-6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">ACP v1.4</text>
    <text x="0" y="10" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">JSON-RPC MCP</text>
    <circle cx="0" cy="22" r="3" fill="#10b981" class="led-fast"/>
  </g>

  <!-- ========================================================================= -->
  <!-- NODE 4: VULCAN SENTINEL (SECURITY FIREWALL) -->
  <!-- ========================================================================= -->
  <g transform="translate(600, 228)">
    <!-- Shield Container -->
    <rect x="-110" y="-24" width="220" height="52" rx="26" fill="#064e3b" fill-opacity="0.85" stroke="#10b981" stroke-width="2" filter="url(#glow)"/>
    <circle cx="-82" cy="2" r="10" fill="#10b981" fill-opacity="0.2"/>
    <path d="M-82 -5 L-76 -2 L-76 4 C-76 8 -82 10 -82 10 C-82 10 -88 8 -88 4 L-88 -2 Z" fill="#10b981"/>
    <text x="-62" y="-3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">VULCAN SENTINEL</text>
    <text x="-62" y="12" font-family="monospace" font-size="10" fill="#6ee7b7">4-Pillar Firewall • Composite 98/100</text>
  </g>

  <!-- ========================================================================= -->
  <!-- NODE 5: RAZORPAY SETTLEMENT ENGINE & SOUNDBOX -->
  <!-- ========================================================================= -->
  <g transform="translate(600, 360)">
    <!-- Main Outer Glow Container -->
    <rect x="-150" y="-38" width="300" height="76" rx="16" fill="#0f172a" fill-opacity="0.95" stroke="#3b82f6" stroke-width="2" filter="url(#glow)"/>
    
    <!-- Razorpay Logo / Badge -->
    <rect x="-135" y="-22" width="44" height="44" rx="10" fill="#1d4ed8" stroke="#60a5fa" stroke-width="1.5"/>
    <path d="M-117 -12 L-123 6 L-115 6 L-119 14 L-107 -2 L-113 -2 Z" fill="#ffffff"/>

    <text x="-78" y="-4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="0.5">RAZORPAY RAILS</text>
    <text x="-78" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#93c5fd">Instant Settlement • B2B GST 18%</text>

    <!-- Acoustic Soundbox Pill -->
    <g transform="translate(68, -14)">
      <rect x="0" y="0" width="66" height="28" rx="14" fill="#047857" fill-opacity="0.35" stroke="#10b981" stroke-width="1"/>
      <circle cx="12" cy="14" r="4" fill="#10b981" class="led-fast"/>
      <text x="22" y="18" font-family="monospace" font-size="9" font-weight="bold" fill="#6ee7b7">AUDIO</text>
    </g>
  </g>

  <!-- Flowing Holographic Packets on Highway -->
  <circle cx="340" cy="140" r="5" fill="#00f2fe" filter="url(#glowIntense)">
    <animate attributeName="cx" values="220;600;980;600;220" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="220;120;220;290;220" dur="4s" repeatCount="indefinite"/>
  </circle>

  <circle cx="860" cy="140" r="5" fill="#a855f7" filter="url(#glowIntense)">
    <animate attributeName="cx" values="980;600;220;600;980" dur="4.8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="220;150;220;290;220" dur="4.8s" repeatCount="indefinite"/>
  </circle>

  <circle cx="600" cy="240" r="4" fill="#10b981" filter="url(#glowIntense)">
    <animate attributeName="cy" values="135;228;360" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Corner Watermark Telemetry -->
  <g transform="translate(40, 440)">
    <text font-family="monospace" font-size="10" fill="#475569">RFC-2104 SHA-256 HMAC LEDGER // NPCI UAP MANDATE // ZERO-LATENCY WEBAUDIO SOUNDBOX</text>
  </g>
</svg>
