<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <radialGradient id="radarBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#022c22" stop-opacity="1"/>
      <stop offset="60%" stop-color="#061c17" stop-opacity="1"/>
      <stop offset="100%" stop-color="#020a08" stop-opacity="1"/>
    </radialGradient>

    <radialGradient id="scanSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.45"/>
      <stop offset="80%" stop-color="#10b981" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <filter id="emeraldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes radarRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulseRing {
      0% { r: 30px; opacity: 0.8; }
      100% { r: 160px; opacity: 0; }
    }
    @keyframes pingTarget {
      0%, 100% { opacity: 0.2; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    @keyframes pulseText {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    .radar-beam {
      transform-origin: 220px 200px;
      animation: radarRotate 4s linear infinite;
    }
    .wave-1 {
      animation: pulseRing 3s ease-out infinite;
    }
    .wave-2 {
      animation: pulseRing 3s ease-out infinite 1.5s;
    }
    .blip-1 {
      animation: pingTarget 1.2s ease-in-out infinite;
    }
    .blip-2 {
      animation: pingTarget 1.8s ease-in-out infinite 0.6s;
    }
    .text-pulse {
      animation: pulseText 2s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="800" height="400" fill="url(#radarBg)"/>

  <!-- Grid overlay -->
  <g opacity="0.1" stroke="#10b981" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="220" y1="0" x2="220" y2="400"/>
    <line x1="440" y1="0" x2="440" y2="400"/>
    <line x1="620" y1="0" x2="620" y2="400"/>
  </g>

  <!-- ========================================================================= -->
  <!-- LEFT: RADAR DISK -->
  <!-- ========================================================================= -->
  <g transform="translate(0, 0)">
    <!-- Concentric radar circles -->
    <circle cx="220" cy="200" r="150" fill="none" stroke="#064e3b" stroke-width="2"/>
    <circle cx="220" cy="200" r="110" fill="none" stroke="#047857" stroke-width="1.5" stroke-dasharray="8 6"/>
    <circle cx="220" cy="200" r="70" fill="none" stroke="#059669" stroke-width="1.5"/>
    <circle cx="220" cy="200" r="30" fill="none" stroke="#10b981" stroke-width="2"/>

    <!-- Crosshairs -->
    <line x1="60" y1="200" x2="380" y2="200" stroke="#10b981" stroke-width="1" opacity="0.4"/>
    <line x1="220" y1="40" x2="220" y2="360" stroke="#10b981" stroke-width="1" opacity="0.4"/>

    <!-- Pulsing Radar Wave Rings -->
    <circle cx="220" cy="200" r="30" fill="none" stroke="#34d399" stroke-width="2" class="wave-1"/>
    <circle cx="220" cy="200" r="30" fill="none" stroke="#10b981" stroke-width="1.5" class="wave-2"/>

    <!-- Rotating Sweep Beam -->
    <g class="radar-beam">
      <path d="M 220 200 L 370 200 A 150 150 0 0 0 326 94 Z" fill="url(#scanSweep)"/>
      <line x1="220" y1="200" x2="370" y2="200" stroke="#34d399" stroke-width="2.5" filter="url(#emeraldGlow)"/>
    </g>

    <!-- Radar Target Blips -->
    <g class="blip-1" transform="translate(290, 140)">
      <circle cx="0" cy="0" r="4" fill="#38bdf8" filter="url(#emeraldGlow)"/>
      <circle cx="0" cy="0" r="8" fill="none" stroke="#38bdf8" stroke-width="1"/>
      <text x="12" y="3" font-family="monospace" font-size="9" fill="#38bdf8">AURA_TX: ₹6,390</text>
    </g>

    <g class="blip-2" transform="translate(150, 260)">
      <circle cx="0" cy="0" r="4" fill="#10b981" filter="url(#emeraldGlow)"/>
      <circle cx="0" cy="0" r="8" fill="none" stroke="#10b981" stroke-width="1"/>
      <text x="12" y="3" font-family="monospace" font-size="9" fill="#10b981">VPA: CLOUDGPU [KYC 98.4%]</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT: 4-PILLAR METRICS & LIVE DECISION MATRIX -->
  <!-- ========================================================================= -->
  <g transform="translate(420, 40)">
    <!-- Header -->
    <rect x="0" y="0" width="340" height="42" rx="8" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="1.2"/>
    <circle cx="20" cy="21" r="5" fill="#10b981" class="text-pulse"/>
    <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff">
      VULCAN SENTINEL AI FIREWALL
    </text>

    <!-- Pillar 1 -->
    <g transform="translate(0, 60)">
      <rect x="0" y="0" width="340" height="54" rx="8" fill="#062e24" stroke="#047857" stroke-width="1"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#6ee7b7">
        1. PROMPT INJECTION FIREWALL (35%)
      </text>
      <text x="290" y="22" font-family="monospace" font-size="12" font-weight="bold" fill="#10b981">100/100</text>
      <rect x="14" y="32" width="312" height="6" rx="3" fill="#044e39"/>
      <rect x="14" y="32" width="312" height="6" rx="3" fill="#10b981"/>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(0, 124)">
      <rect x="0" y="0" width="340" height="54" rx="8" fill="#062e24" stroke="#047857" stroke-width="1"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#6ee7b7">
        2. BOUNDED MANDATE RAIL (30%)
      </text>
      <text x="290" y="22" font-family="monospace" font-size="12" font-weight="bold" fill="#10b981">95/100</text>
      <rect x="14" y="32" width="312" height="6" rx="3" fill="#044e39"/>
      <rect x="14" y="32" width="296" height="6" rx="3" fill="#10b981"/>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(0, 188)">
      <rect x="0" y="0" width="340" height="54" rx="8" fill="#062e24" stroke="#047857" stroke-width="1"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#6ee7b7">
        3. MERCHANT TRUST DIRECTORY (20%)
      </text>
      <text x="290" y="22" font-family="monospace" font-size="12" font-weight="bold" fill="#10b981">98/100</text>
      <rect x="14" y="32" width="312" height="6" rx="3" fill="#044e39"/>
      <rect x="14" y="32" width="305" height="6" rx="3" fill="#10b981"/>
    </g>

    <!-- Pillar 4 -->
    <g transform="translate(0, 252)">
      <rect x="0" y="0" width="340" height="54" rx="8" fill="#062e24" stroke="#047857" stroke-width="1"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#6ee7b7">
        4. SEMANTIC INTENT ALIGNMENT (15%)
      </text>
      <text x="290" y="22" font-family="monospace" font-size="12" font-weight="bold" fill="#10b981">95/100</text>
      <rect x="14" y="32" width="312" height="6" rx="3" fill="#044e39"/>
      <rect x="14" y="32" width="296" height="6" rx="3" fill="#10b981"/>
    </g>

    <!-- Verdict Pill -->
    <g transform="translate(0, 316)">
      <rect x="0" y="0" width="340" height="36" rx="18" fill="#059669" fill-opacity="0.3" stroke="#10b981" stroke-width="1.5" filter="url(#emeraldGlow)"/>
      <circle cx="20" cy="18" r="4" fill="#34d399" class="text-pulse"/>
      <text x="36" y="23" font-family="monospace" font-size="12" font-weight="bold" fill="#34d399" letter-spacing="1">
        VERDICT: CLEARANCE GRANTED (98/100)
      </text>
    </g>
  </g>
</svg>
